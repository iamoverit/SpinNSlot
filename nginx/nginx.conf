log_format nginxlog '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host="$host" '
                    'rt=$request_time '
                    'uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" '
                    'urt="$upstream_response_time" '
                    'uaddr="$upstream_addr" '
                    'req_len=$request_length';

upstream web {
    server spinnslot_web:8000;
}

server {
    listen 80;

    set_real_ip_from 10.89.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/spinnslot_access.log nginxlog;

    location = /stub_status {
        stub_status;
        access_log off;

        allow 127.0.0.1;
        allow 10.89.0.0/16;
        deny all;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
    
    location = /robots.txt {
        alias /app/staticfiles/robots.txt;
    }
    
    location = /favicon.ico {
        alias /app/staticfiles/favicon.ico;
    }
}
